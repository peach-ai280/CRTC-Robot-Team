<svg viewBox="0 0 680 300" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>无线继电器接线图</title>
<desc>5 端子继电器 -V +V NO COM NC：COM 接电池正、NO 接 7.4V 主干、+V 接 5V、-V 接地、NC 悬空</desc>
<defs>
<marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="20" width="600" height="130" rx="12" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
<text x="60" y="44" font-family="sans-serif" font-size="14" font-weight="600" fill="#0c447c">继电器模块（SONGLE SRD-05VDC-SL-C，无线遥控型）</text>
<g font-family="sans-serif">
<rect x="60" y="58" width="96" height="46" rx="8" fill="#fff" stroke="#378add" stroke-width="0.5"/>
<text x="108" y="77" font-size="13" font-weight="600" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">-V</text>
<text x="108" y="95" font-size="11" fill="#5f5e5a" text-anchor="middle" dominant-baseline="central">电源负</text>
<rect x="164" y="58" width="96" height="46" rx="8" fill="#fff" stroke="#378add" stroke-width="0.5"/>
<text x="212" y="77" font-size="13" font-weight="600" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">+V</text>
<text x="212" y="95" font-size="11" fill="#5f5e5a" text-anchor="middle" dominant-baseline="central">电源正 5V</text>
<rect x="268" y="58" width="96" height="46" rx="8" fill="#fff" stroke="#378add" stroke-width="0.5"/>
<text x="316" y="77" font-size="13" font-weight="600" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">NO</text>
<text x="316" y="95" font-size="11" fill="#5f5e5a" text-anchor="middle" dominant-baseline="central">常开</text>
<rect x="372" y="58" width="96" height="46" rx="8" fill="#fff" stroke="#378add" stroke-width="0.5"/>
<text x="420" y="77" font-size="13" font-weight="600" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">COM</text>
<text x="420" y="95" font-size="11" fill="#5f5e5a" text-anchor="middle" dominant-baseline="central">公共端</text>
<rect x="476" y="58" width="96" height="46" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
<text x="524" y="77" font-size="13" font-weight="600" fill="#5f5e5a" text-anchor="middle" dominant-baseline="central">NC</text>
<text x="524" y="95" font-size="11" fill="#5f5e5a" text-anchor="middle" dominant-baseline="central">常闭·悬空</text>
</g>
<rect x="60" y="112" width="512" height="28" rx="8" fill="#faeeda" stroke="#ba7517" stroke-width="0.5"/>
<text x="76" y="131" font-family="sans-serif" font-size="12" fill="#633806" dominant-baseline="central">+V/-V 是「线圈供电」；NO/COM/NC 是「被切的触点」，两组别混</text>

<rect x="40" y="180" width="150" height="52" rx="8" fill="#fcebeb" stroke="#e24b4a" stroke-width="0.5"/>
<text x="115" y="202" font-family="sans-serif" font-size="13" font-weight="600" fill="#a32d2d" text-anchor="middle" dominant-baseline="central">电池 +（7.4V）</text>
<text x="115" y="218" font-family="sans-serif" font-size="12" fill="#a32d2d" text-anchor="middle" dominant-baseline="central">只进 COM</text>
<rect x="470" y="180" width="170" height="52" rx="8" fill="#e24b4a"/>
<text x="555" y="202" font-family="sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="central">7.4V 主干</text>
<text x="555" y="218" font-family="sans-serif" font-size="12" fill="#fcebeb" text-anchor="middle" dominant-baseline="central">从 NO 出去</text>
<line x1="190" y1="206" x2="370" y2="81" stroke="#e24b4a" stroke-width="2" marker-end="url(#arr3)"/>
<line x1="476" y1="81" x2="555" y2="180" stroke="#e24b4a" stroke-width="2" marker-end="url(#arr3)"/>
<text x="280" y="168" font-family="sans-serif" font-size="12" fill="#a32d2d" dominant-baseline="central">电池+ → COM，NO → 7.4V 主干（串接）</text>

<rect x="40" y="250" width="150" height="40" rx="8" fill="#eaf3de" stroke="#3b6d11" stroke-width="0.5"/>
<text x="115" y="271" font-family="sans-serif" font-size="12" font-weight="600" fill="#27500a" text-anchor="middle" dominant-baseline="central">+V ← 5V 主干</text>
<rect x="470" y="250" width="170" height="40" rx="8" fill="#888780"/>
<text x="555" y="271" font-family="sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="central">-V ← 地主干</text>
<line x1="190" y1="270" x2="164" y2="81" stroke="#ba7517" stroke-width="1.5" marker-end="url(#arr3)"/>
<line x1="470" y1="270" x2="60" y2="81" stroke="#888780" stroke-width="1.5" marker-end="url(#arr3)"/>
</svg>
